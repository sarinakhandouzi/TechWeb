<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact – TechWeb</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main" class="container narrow section">
        <p class="eyebrow">Contact</p>
        <h1>Contact us</h1>
        <p class="muted">It is a Demo form: it validates your input in the browser, but messages are not delivered.</p>
        <form id="contact-form" class="form" novalidate>
            <div class="field"><label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name"><span class="error" id="name-error"></span>
            </div>
            <div class="field"><label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email"><span class="error"
                    id="email-error"></span>
            </div>
            <div class="field"><label for="subject">Subject</label>
                <input id="subject" name="subject" type="text"><span class="error" id="subject-error"></span>
            </div>
            <div class="field"><label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea><span class="error" id="message-error"></span>
            </div>
            <button class="btn" type="submit">Send message</button>
            <p id="contact-msg" class="form-msg" role="status"></p>
        </form>
    </main>
    <div id="site-footer"></div>
</body>

</html>
